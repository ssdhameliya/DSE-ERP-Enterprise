name: Deploy Web Showcase & Portals

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'web-v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Select deployment scope (UAT is always deployed 1st)'
        required: true
        default: 'uat-only'
        type: choice
        options:
          - 'uat-only'
          - 'uat-then-prod'

permissions:
  contents: read

concurrency:
  group: dse-web-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-uat:
    name: 1. Deploy to UAT Testing Environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Authentication & Speed Optimizer
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DSE_UAT_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DSE_UAT_SSH_HOST }} >> ~/.ssh/known_hosts
          cat << 'EOF' > ~/.ssh/config
          Host *
            ServerAliveInterval 15
            ServerAliveCountMax 3
            Compression yes
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 120s
            StrictHostKeyChecking accept-new
          EOF

      - name: Upload Web Assets to UAT (Public + Admin)
        run: |
          # 1. Package Admin Studio locally
          tar -czf /tmp/web_uat_admin.tar.gz -C web/admin .
          # 2. Upload over multiplexed compressed SSH connection
          scp web/public/index.html ${{ secrets.DSE_UAT_SSH_USER }}@${{ secrets.DSE_UAT_SSH_HOST }}:/tmp/web_uat_public.html
          scp /tmp/web_uat_admin.tar.gz ${{ secrets.DSE_UAT_SSH_USER }}@${{ secrets.DSE_UAT_SSH_HOST }}:/tmp/web_uat_admin.tar.gz
          
          # 3. Fast unpack and permission sync
          ssh ${{ secrets.DSE_UAT_SSH_USER }}@${{ secrets.DSE_UAT_SSH_HOST }} '
            sudo cp /tmp/web_uat_public.html /srv/dse-erp/web/public/index.html &&
            sudo mkdir -p /srv/dse-erp/web/admin &&
            sudo tar -xzf /tmp/web_uat_admin.tar.gz --no-same-owner -C /srv/dse-erp/web/admin/ &&
            sudo chmod -R a+rX /srv/dse-erp/web/public /srv/dse-erp/web/admin &&
            if command -v chcon >/dev/null 2>&1; then
              sudo chcon -R -t httpd_sys_content_t /srv/dse-erp/web/public /srv/dse-erp/web/admin 2>/dev/null || true
            fi

            # Provision canonical application secret key to eliminate "Unable to decrypt application secret"
            CANONICAL_KEY="+SDIy8FzaYbEIKtrxW7szEwwjbE5e5npQ6E+8x8OnMw="
            for D in /home/dseerp /var/lib/dseerp /root; do
              if [ -d "$D" ]; then
                sudo mkdir -p "$D/.dse-erp"
                echo "$CANONICAL_KEY" | sudo tee "$D/.dse-erp/secret.key" > /dev/null
                sudo chmod 600 "$D/.dse-erp/secret.key"
                if [ "$D" != "/root" ]; then
                  sudo chown -R dseerp:dseerp "$D/.dse-erp" 2>/dev/null || true
                fi
              fi
            done
            RESTART_NEEDED=0
            for ENVFILE in /etc/dse-erp/uat.env /etc/dse-erp/dse-erp.env; do
              if [ -f "$ENVFILE" ]; then
                if sudo grep -q "DSE_SECRET_KEY" "$ENVFILE"; then
                  sudo sed -i "s|^DSE_SECRET_KEY=.*|DSE_SECRET_KEY=$CANONICAL_KEY|" "$ENVFILE"
                else
                  echo "DSE_SECRET_KEY=$CANONICAL_KEY" | sudo tee -a "$ENVFILE" > /dev/null
                fi
                RESTART_NEEDED=1
              fi
            done
            if [ "$RESTART_NEEDED" -eq 1 ]; then
              sudo systemctl restart dse-erp-uat 2>/dev/null || sudo systemctl restart dse-erp@uat 2>/dev/null || true
            fi
          '

      - name: Verify Live UAT Endpoints
        run: |
          curl -fsSL https://web-uat.jasviindustries.in | grep -q "Jasvi Industries"
          curl -fsSL https://erp-uat.jasviindustries.in | grep -q "Jasvi Industries ERP"
          READY=0
          for i in {1..20}; do
            if curl -fsSL https://erp-uat.jasviindustries.in/api/runtime/health 2>/dev/null | grep -q '"ready":true'; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo "UAT backend runtime did not report ready within 40s"
            exit 1
          fi
          echo "UAT Showcase, Admin Studio, and Backend Runtime verified and LIVE!"

  deploy-prod:
    name: 2. Deploy to Production Environment (After UAT)
    needs: deploy-uat
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'uat-then-prod')
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Authentication & Speed Optimizer
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DSE_PROD_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DSE_PROD_SSH_HOST }} >> ~/.ssh/known_hosts
          cat << 'EOF' > ~/.ssh/config
          Host *
            ServerAliveInterval 15
            ServerAliveCountMax 3
            Compression yes
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 120s
            StrictHostKeyChecking accept-new
          EOF

      - name: Upload Web Assets to PROD (Public + Admin)
        run: |
          # 1. Package Admin Studio locally
          tar -czf /tmp/web_prod_admin.tar.gz -C web/admin .
          # 2. Upload over multiplexed compressed SSH connection
          scp web/public/index.html ${{ secrets.DSE_PROD_SSH_USER }}@${{ secrets.DSE_PROD_SSH_HOST }}:/tmp/web_prod_public.html
          scp /tmp/web_prod_admin.tar.gz ${{ secrets.DSE_PROD_SSH_USER }}@${{ secrets.DSE_PROD_SSH_HOST }}:/tmp/web_prod_admin.tar.gz
          
          # 3. Fast unpack, permission sync, and server encryption key provisioning
          ssh ${{ secrets.DSE_PROD_SSH_USER }}@${{ secrets.DSE_PROD_SSH_HOST }} '
            sudo cp /tmp/web_prod_public.html /srv/dse-erp/web/public/index.html &&
            sudo mkdir -p /srv/dse-erp/web/admin &&
            sudo tar -xzf /tmp/web_prod_admin.tar.gz --no-same-owner -C /srv/dse-erp/web/admin/ &&
            sudo chmod -R a+rX /srv/dse-erp/web/public /srv/dse-erp/web/admin &&
            if command -v chcon >/dev/null 2>&1; then
              sudo chcon -R -t httpd_sys_content_t /srv/dse-erp/web/public /srv/dse-erp/web/admin 2>/dev/null || true
            fi

            # Provision canonical application secret key to eliminate "Unable to decrypt application secret"
            CANONICAL_KEY="+SDIy8FzaYbEIKtrxW7szEwwjbE5e5npQ6E+8x8OnMw="
            for D in /home/dseerp /var/lib/dseerp /root; do
              if [ -d "$D" ]; then
                sudo mkdir -p "$D/.dse-erp"
                echo "$CANONICAL_KEY" | sudo tee "$D/.dse-erp/secret.key" > /dev/null
                sudo chmod 600 "$D/.dse-erp/secret.key"
                if [ "$D" != "/root" ]; then
                  sudo chown -R dseerp:dseerp "$D/.dse-erp" 2>/dev/null || true
                fi
              fi
            done
            RESTART_NEEDED=0
            for ENVFILE in /etc/dse-erp/prod.env /etc/dse-erp/dse-erp.env; do
              if [ -f "$ENVFILE" ]; then
                if sudo grep -q "DSE_SECRET_KEY" "$ENVFILE"; then
                  sudo sed -i "s|^DSE_SECRET_KEY=.*|DSE_SECRET_KEY=$CANONICAL_KEY|" "$ENVFILE"
                else
                  echo "DSE_SECRET_KEY=$CANONICAL_KEY" | sudo tee -a "$ENVFILE" > /dev/null
                fi
                RESTART_NEEDED=1
              fi
            done
            if [ "$RESTART_NEEDED" -eq 1 ]; then
              sudo systemctl restart dse-erp-prod 2>/dev/null || sudo systemctl restart dse-erp@prod 2>/dev/null || true
            fi
          '

      - name: Verify Live PROD Endpoints
        run: |
          curl -fsSL https://jasviindustries.in | grep -q "Jasvi Industries"
          curl -fsSL https://www.jasviindustries.in | grep -q "Jasvi Industries"
          curl -fsSL https://erp.jasviindustries.in | grep -q "Jasvi Industries ERP"
          READY=0
          for i in {1..20}; do
            if curl -fsSL https://erp.jasviindustries.in/api/runtime/health 2>/dev/null | grep -q '"ready":true'; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo "PROD backend runtime did not report ready within 40s"
            exit 1
          fi
          echo "PROD Showcase, Admin Studio, and Backend Runtime verified and LIVE!"
