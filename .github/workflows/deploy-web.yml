name: Deploy Web Showcase & Portals

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'web-v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Select deployment scope (UAT is always deployed 1st)'
        required: true
        default: 'uat-only'
        type: choice
        options:
          - 'uat-only'
          - 'uat-then-prod'

permissions:
  contents: read

concurrency:
  group: dse-web-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-uat:
    name: 1. Deploy to UAT Testing Environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Authentication
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DSE_UAT_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DSE_UAT_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Upload Web Assets to UAT (Public + Admin)
        run: |
          # 1. Upload Public Showcase
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa web/public/index.html ${{ secrets.DSE_UAT_SSH_USER }}@${{ secrets.DSE_UAT_SSH_HOST }}:/tmp/web_uat_public.html
          # 2. Package and Upload Complete Admin Studio (HTML + CSS + JS)
          tar -czf /tmp/web_uat_admin.tar.gz -C web/admin .
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa /tmp/web_uat_admin.tar.gz ${{ secrets.DSE_UAT_SSH_USER }}@${{ secrets.DSE_UAT_SSH_HOST }}:/tmp/web_uat_admin.tar.gz
          
          # Deploy and set SELinux permissions
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa ${{ secrets.DSE_UAT_SSH_USER }}@${{ secrets.DSE_UAT_SSH_HOST }} '
            sudo cp /tmp/web_uat_public.html /srv/dse-erp/web/public/index.html &&
            sudo mkdir -p /srv/dse-erp/web/admin &&
            sudo tar -xzf /tmp/web_uat_admin.tar.gz -C /srv/dse-erp/web/admin/ &&
            sudo chcon -R -t httpd_sys_content_t /srv/dse-erp/web/ &&
            sudo chmod -R 755 /srv/dse-erp/web/ &&
            sudo chmod 644 /srv/dse-erp/web/public/index.html /srv/dse-erp/web/admin/index.html
          '

      - name: Verify Live UAT Endpoints
        run: |
          sleep 2
          curl -fsSL https://web-uat.jasviindustries.in | grep -q "Jasvi Industries"
          curl -fsSL https://erp-uat.jasviindustries.in | grep -q "Jasvi Industries ERP"
          echo "UAT Showcase and Admin Studio verified and LIVE!"

  deploy-prod:
    name: 2. Deploy to Production Environment (After UAT)
    needs: deploy-uat
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'uat-then-prod')
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Authentication
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DSE_PROD_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DSE_PROD_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Upload Web Assets to PROD (Public + Admin)
        run: |
          # 1. Upload Public Showcase
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa web/public/index.html ${{ secrets.DSE_PROD_SSH_USER }}@${{ secrets.DSE_PROD_SSH_HOST }}:/tmp/web_prod_public.html
          # 2. Package and Upload Complete Admin Studio (HTML + CSS + JS)
          tar -czf /tmp/web_prod_admin.tar.gz -C web/admin .
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa /tmp/web_prod_admin.tar.gz ${{ secrets.DSE_PROD_SSH_USER }}@${{ secrets.DSE_PROD_SSH_HOST }}:/tmp/web_prod_admin.tar.gz
          
          # Deploy and set SELinux permissions
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa ${{ secrets.DSE_PROD_SSH_USER }}@${{ secrets.DSE_PROD_SSH_HOST }} '
            sudo cp /tmp/web_prod_public.html /srv/dse-erp/web/public/index.html &&
            sudo mkdir -p /srv/dse-erp/web/admin &&
            sudo tar -xzf /tmp/web_prod_admin.tar.gz -C /srv/dse-erp/web/admin/ &&
            sudo chcon -R -t httpd_sys_content_t /srv/dse-erp/web/ &&
            sudo chmod -R 755 /srv/dse-erp/web/ &&
            sudo chmod 644 /srv/dse-erp/web/public/index.html /srv/dse-erp/web/admin/index.html
          '

      - name: Verify Live PROD Endpoints
        run: |
          sleep 2
          curl -fsSL https://jasviindustries.in | grep -q "Jasvi Industries"
          curl -fsSL https://www.jasviindustries.in | grep -q "Jasvi Industries"
          curl -fsSL https://erp.jasviindustries.in | grep -q "Jasvi Industries ERP"
          echo "PROD Showcase and Admin Studio verified and LIVE!"
